# StormCast regression training using two years of SINGV training data.
#
# Training:
#   1995-01-01 through 1996-12-31
#
# Validation:
#   1997-01-01 through 1997-04-30
#
# The architecture remains deliberately small for this first sustained run.

defaults:
  - dataset/singv_regression
  - model/stormcast
  - training/default
  - sampler/edm_deterministic
  - hydra/default
  - _self_

model:
  regression_conditions: ["state"]

  hyperparameters:
    model_channels: 32
    channel_mult: [1, 2, 2, 2]
    num_blocks: 1
    attn_resolutions: []
    bottleneck_attention: false
    checkpoint_level: 0

training:
  outdir: /scratch/users/nus/e1155933/retraining/runs
  experiment_name: singv-regression-2years
  run_id: training-30000steps
  rundir: ${training.outdir}/${training.experiment_name}/${training.run_id}

  # Retain the known-working conservative loader configuration.
  num_data_workers: 0

  batch_size: 1
  batch_size_per_gpu: 1

  # Approximately 2923 pairs per epoch:
  # 30000 steps is approximately 10.3 epochs.
  total_train_steps: 30000

  lr_rampup_steps: 0
  clip_grad_norm: 1.0

  print_progress_freq: 20

  # Validate and checkpoint about six times per two epochs.
  validation_freq: 500
  checkpoint_freq: 500
  validation_steps: 16

  validation_plot_variables:
    - tas
    - pr
    - ta_1000
    - hus_50

  log_to_wandb: false