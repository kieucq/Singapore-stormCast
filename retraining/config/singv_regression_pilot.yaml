# First non-smoke StormCast regression training run using SINGV data.

defaults:
  - dataset/singv_regression
  - model/stormcast
  - training/default
  - sampler/edm_deterministic
  - hydra/default
  - _self_

model:
  regression_conditions: ["state"]

  # Retain the smaller architecture for the initial pilot.
  hyperparameters:
    model_channels: 32
    channel_mult: [1, 2, 2, 2]
    num_blocks: 1
    attn_resolutions: []
    bottleneck_attention: false
    checkpoint_level: 0

training:
  outdir: /scratch/users/nus/e1155933/retraining/runs
  experiment_name: singv-regression-pilot
  run_id: pilot-100steps
  rundir: ${training.outdir}/${training.experiment_name}/${training.run_id}

  num_data_workers: 0

  batch_size: 1
  batch_size_per_gpu: 1

  total_train_steps: 1000
  lr_rampup_steps: 0
  clip_grad_norm: 1.0

  print_progress_freq: 5
  validation_freq: 100
  checkpoint_freq: 100
  validation_steps: 4

  validation_plot_variables:
    - tas
    - pr
    - ta_1000
    - hus_50

  log_to_wandb: false