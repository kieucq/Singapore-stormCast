# SINGV dataset used for the ten-year regression training run.
#
# Training:
#   1995-01-01 through 2004-12-31
#
# Validation:
#   2005-01-01 through 2005-12-31

name: regression_dataset_adapter.RegressionDatasetAdapter

data_root: ~/scratch/retraining

train_manifest: manifests/training_19950101_20041231.csv
validation_manifest: manifests/validation_20050101_20051231.csv

normalisation_path: normalisation_stats/training_19950101_20041231_normalisation_stats.npz
background_normalisation_path: normalisation_stats/training_19950101_20041231_background_normalisation_stats.npz