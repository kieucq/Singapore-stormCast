# StormCast regression training using ten years of SINGV training data.
#
# Training:
#   1995-01-01 through 2004-12-31
#
# Validation:
#   2005-01-01 through 2005-12-31
#
# This retains the architecture that completed the two-year 30,000-step run.

defaults:
  - dataset/singv_10years
  - model/stormcast
  - training/default
  - sampler/edm_deterministic
  - hydra/default
  - _self_

model:
  regression_conditions: ["state"]

  hyperparameters:
    model_channels: 32
    channel_mult: [1, 2, 2, 2]
    num_blocks: 1
    attn_resolutions: []
    bottleneck_attention: false
    checkpoint_level: 0

training:
  outdir: /scratch/users/nus/e1155933/retraining/runs
  experiment_name: singv-regression-10years
  run_id: training-100000steps
  rundir: ${training.outdir}/${training.experiment_name}/${training.run_id}

  # Keep the conservative loader configuration used by the successful run.
  num_data_workers: 0

  batch_size: 1
  batch_size_per_gpu: 1

  # Approximately 14,611 training pairs:
  # 100,000 steps is approximately 6.8 epochs.
  total_train_steps: 100000

  lr_rampup_steps: 0
  clip_grad_norm: 1.0

  print_progress_freq: 20

  # Frequent checkpoints are useful because the run may exceed one PBS job.
  validation_freq: 1000
  checkpoint_freq: 1000
  validation_steps: 16

  validation_plot_variables:
    - tas
    - pr
    - ta_850
    - hus_850

  log_to_wandb: false