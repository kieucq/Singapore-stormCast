# StormCast diffusion training using ten years of SINGV training data.
#
# Training:
#   1995-01-01 through 2004-12-31
#
# Validation:
#   2005-01-01 through 2005-12-31
#
# The diffusion model learns the residual between the true target state
# and the forecast produced by the frozen 100,000-step regression model.

defaults:
  - dataset/singv_10years
  - model/stormcast
  - training/default
  - sampler/edm_deterministic
  - hydra/default
  - _self_

model:
  model_name: diffusion

  # Conditions used by the frozen regression model.
  regression_conditions:
    - state
    - background

  # Conditions supplied to the diffusion model.
  diffusion_conditions:
    - state
    - background
    - regression

  regression_weights: /scratch/users/nus/e1155933/retraining/runs/singv-era5-regression-10years/training-100000steps/checkpoints_regression/StormCastUNet.0.100000.mdlus

  spatial_pos_embed: false

  # Retain the architecture verified by the diffusion smoke test.
  hyperparameters:
    model_channels: 32
    channel_mult: [1, 2, 2, 2]
    num_blocks: 1
    attn_resolutions: []
    bottleneck_attention: false
    checkpoint_level: 0

training:
  outdir: /scratch/users/nus/e1155933/retraining/runs
  experiment_name: singv-era5-diffusion-10years
  run_id: training-100000steps-bf16-compile
  rundir: ${training.outdir}/${training.experiment_name}/${training.run_id}

  initial_weights: null

  # Retain the conservative loader configuration used by the
  # successful regression and diffusion smoke-test runs.
  num_data_workers: 4

  batch_size: 1
  batch_size_per_gpu: 1

  # Approximately 14,611 training pairs:
  # 100,000 steps is approximately 6.8 passes through the dataset.
  total_train_steps: 100000

  lr: 0.0004
  lr_rampup_steps: 0
  clip_grad_norm: 1.0

  print_progress_freq: 20

  # Frequent checkpoints allow the run to resume across PBS jobs.
  checkpoint_freq: 5000
  validation_freq: 5000
  validation_steps: 1

  perf:
    fp_optimizations: amp-bf16
    torch_compile: true
    use_apex_gn: false
    allow_tf32: true
    allow_fp16_reduced_precision: false

  validation_plot_variables:
    - tas
    - pr
    - ta_1000
    - ua_1000
    - ta_850
    - zg_500

  validation_plot_background_variables:
    - t2m
    - mslp

  log_to_wandb: false

  loss:
    type: edm

# Use the normal deterministic EDM sampler for validation forecasts.
sampler:
  args:
    num_steps: 18