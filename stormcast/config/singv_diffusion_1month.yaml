# StormCast diffusion training using one month of SINGV training data.
#
# Training:
#   1995-01-01 through 1995-01-31
#
# Validation:
#   1995-02-01 through 1995-02-07
#
# The diffusion model learns the residual between the true target state
# and the forecast produced by the frozen 1,000-step regression model.
#
# This configuration is intended as a small end-to-end pipeline example,
# not as a scientifically meaningful diffusion training run.

defaults:
  - dataset/singv_1month
  - model/stormcast
  - training/default
  - sampler/edm_deterministic
  - hydra/default
  - _self_

model:
  model_name: diffusion

  # Conditions used by the frozen regression model.
  regression_conditions:
    - state

  # Conditions supplied to the diffusion model.
  diffusion_conditions:
    - state
    - regression

  regression_weights: /scratch/users/nus/e1155933/retraining/runs/singv-regression-1month/training-1000steps/checkpoints_regression/StormCastUNet.0.1000.mdlus

  spatial_pos_embed: false

  # Use the same small architecture as the one-month regression example.
  hyperparameters:
    model_channels: 32
    channel_mult: [1, 2, 2, 2]
    num_blocks: 1
    attn_resolutions: []
    bottleneck_attention: false
    checkpoint_level: 0

training:
  outdir: /scratch/users/nus/e1155933/retraining/runs
  experiment_name: singv-diffusion-1month
  run_id: training-1000steps
  rundir: ${training.outdir}/${training.experiment_name}/${training.run_id}

  num_data_workers: 0

  batch_size: 1
  batch_size_per_gpu: 1

  # January 1995 contains 123 contiguous six-hour pairs.
  # 1,000 steps is approximately 8.1 passes through the dataset.
  total_train_steps: 1000

  lr: 0.0004
  lr_rampup_steps: 0
  clip_grad_norm: 1.0

  print_progress_freq: 20

  # Validate and checkpoint approximately once every two epochs.
  checkpoint_freq: 250
  validation_freq: 250
  validation_steps: 1

  perf:
    fp_optimizations: amp-bf16
    torch_compile: true
    use_apex_gn: false
    allow_tf32: true
    allow_fp16_reduced_precision: false

  validation_plot_variables:
    - tas
    - pr
    - ta_1000
    - ta_850
    - hus_850
    - zg_500

  validation_plot_background_variables: []

  log_to_wandb: false

  loss:
    type: edm

# Use the normal deterministic EDM sampler for validation forecasts.
sampler:
  args:
    num_steps: 18